# ============================================================
#  EterHome
# ============================================================
#
#  Serveur, base de données, Redis, téléportation (attente, cooldown,
#  combat), langue et couleurs se règlent dans EterLib/config.yml,
#  communs à tous les plugins Eter. Ici, seulement ce qui concerne les homes.
#  Toute modification nécessite un redémarrage du serveur.

homes:
  # Nombre de homes par joueur. Une permission eterhome.limit.<n> (ex : eterhome.limit.10)
  # peut l'augmenter, jamais le baisser ; eterhome.limit.unlimited le supprime.
  default-limit: 3
